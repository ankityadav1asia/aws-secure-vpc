<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker></defs>
<rect width="1600" height="980" fill="#f8fafc"/>
<text x="800" y="55" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#0f172a">AWS Secure Multi-Tier VPC Architecture</text>
<text x="800" y="88" text-anchor="middle" font-family="Arial" font-size="18" fill="#475569">Terraform • ap-south-1 • Multi-AZ • Private Application + Database Tiers</text>
<rect x="50" y="125" width="1500" height="800" rx="28" fill="white" stroke="#64748b" stroke-width="3"/>
<text x="80" y="160" font-family="Arial" font-size="22" font-weight="700" fill="#1e293b">VPC 10.0.0.0/16</text>
<!-- Internet/WAF/ALB -->
<rect x="90" y="200" width="210" height="100" rx="16" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/><text x="195" y="240" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700">Internet</text><text x="195" y="270" text-anchor="middle" font-family="Arial" font-size="16">Users / Clients</text>
<rect x="350" y="200" width="250" height="100" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="475" y="240" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700">AWS WAF</text><text x="475" y="270" text-anchor="middle" font-family="Arial" font-size="16">Web ACL / Managed Rules</text>
<rect x="650" y="200" width="300" height="100" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="800" y="240" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700">Application Load Balancer</text><text x="800" y="270" text-anchor="middle" font-family="Arial" font-size="16">Public Subnets • HTTP :80</text>
<line x1="300" y1="250" x2="350" y2="250" stroke="#334155" stroke-width="4" marker-end="url(#a)"/><line x1="600" y1="250" x2="650" y2="250" stroke="#334155" stroke-width="4" marker-end="url(#a)"/>
<!-- AZ columns -->
<rect x="85" y="350" width="700" height="500" rx="20" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="435" y="385" text-anchor="middle" font-family="Arial" font-size="23" font-weight="700" fill="#334155">Availability Zone A</text>
<rect x="815" y="350" width="700" height="500" rx="20" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="1165" y="385" text-anchor="middle" font-family="Arial" font-size="23" font-weight="700" fill="#334155">Availability Zone B</text>
<!-- Public -->
<rect x="115" y="410" width="640" height="95" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="435" y="445" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700">Public Subnet A</text><text x="435" y="475" text-anchor="middle" font-family="Arial" font-size="16">10.0.1.0/24 • ALB • Internet Gateway</text>
<rect x="845" y="410" width="640" height="95" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="1165" y="445" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700">Public Subnet B</text><text x="1165" y="475" text-anchor="middle" font-family="Arial" font-size="16">10.0.2.0/24 • ALB • Internet Gateway</text>
<!-- App -->
<rect x="115" y="535" width="640" height="110" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="435" y="570" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700">Private App Subnet A</text><text x="435" y="600" text-anchor="middle" font-family="Arial" font-size="16">10.0.11.0/24 • EC2 • Auto Scaling</text><text x="435" y="625" text-anchor="middle" font-family="Arial" font-size="15">No public IP • SSM managed</text>
<rect x="845" y="535" width="640" height="110" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="1165" y="570" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700">Private App Subnet B</text><text x="1165" y="600" text-anchor="middle" font-family="Arial" font-size="16">10.0.12.0/24 • EC2 • Auto Scaling</text><text x="1165" y="625" text-anchor="middle" font-family="Arial" font-size="15">No public IP • SSM managed</text>
<!-- DB -->
<rect x="115" y="675" width="640" height="105" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="435" y="710" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700">Private DB Subnet A</text><text x="435" y="742" text-anchor="middle" font-family="Arial" font-size="16">10.0.21.0/24 • RDS MySQL</text><text x="435" y="765" text-anchor="middle" font-family="Arial" font-size="14">PubliclyAccessible = false</text>
<rect x="845" y="675" width="640" height="105" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="1165" y="710" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700">Private DB Subnet B</text><text x="1165" y="742" text-anchor="middle" font-family="Arial" font-size="16">10.0.22.0/24 • RDS MySQL</text><text x="1165" y="765" text-anchor="middle" font-family="Arial" font-size="14">PubliclyAccessible = false</text>
<!-- arrows -->
<line x1="800" y1="300" x2="435" y2="535" stroke="#334155" stroke-width="4" marker-end="url(#a)"/><line x1="800" y1="300" x2="1165" y2="535" stroke="#334155" stroke-width="4" marker-end="url(#a)"/>
<line x1="435" y1="645" x2="435" y2="675" stroke="#334155" stroke-width="4" marker-end="url(#a)"/><line x1="1165" y1="645" x2="1165" y2="675" stroke="#334155" stroke-width="4" marker-end="url(#a)"/>
<!-- NAT -->
<rect x="210" y="805" width="450" height="45" rx="12" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/><text x="435" y="834" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700">NAT Gateway A → outbound internet only</text>
<rect x="940" y="805" width="450" height="45" rx="12" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/><text x="1165" y="834" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700">NAT Gateway B → outbound internet only</text>
<!-- security flow -->
<text x="800" y="895" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#0f172a">Security path: WAF → ALB → App Security Group → DB Security Group</text>
<text x="800" y="920" text-anchor="middle" font-family="Arial" font-size="15" fill="#475569">Audit: CloudTrail → S3   |   Network telemetry: VPC Flow Logs → CloudWatch Logs   |   Management: IAM + SSM</text>
</svg>